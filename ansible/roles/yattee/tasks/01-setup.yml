---
- name: 创建 Yattee 相关目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ yattee_install_dir }}"
    - "{{ yattee_data_dir }}"
    - "{{ yattee_cache_dir }}"
    - "{{ yattee_tailscale_state_dir }}"

- name: 检查 Yattee 源码是否存在
  ansible.builtin.stat:
    path: "{{ yattee_install_dir }}/.git"
  register: yattee_git_check

- name: 使用 Docker 克隆 Yattee 源码 (适配无 git 的 QNAP 环境)
  ansible.builtin.command:
    cmd: "{{ qnap_docker_bin | default('docker') }} run --rm -v {{ yattee_install_dir }}:/git -w /git alpine/git clone https://github.com/yattee/yattee-server.git ."
  when: not yattee_git_check.stat.exists

- name: 使用 Docker 更新 Yattee 源码
  ansible.builtin.command:
    cmd: "{{ qnap_docker_bin | default('docker') }} run --rm --entrypoint sh -v {{ yattee_install_dir }}:/git -w /git alpine/git -c 'git config --global --add safe.directory /git && git pull origin main'"
  when: yattee_git_check.stat.exists
  register: git_pull_result
  changed_when: "'Already up to date.' not in git_pull_result.stdout"
