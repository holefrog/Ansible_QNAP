---
- name: 提示 Yattee 构建和部署时间
  ansible.builtin.debug:
    msg: "⚠️ 正在通过 Docker 构建并启动 Yattee Server，由于需要编译镜像，首次部署大约需要 5 - 10 分钟，请耐心等待..."

- name: 启动 Yattee Server 容器
  ansible.builtin.command:
    cmd: "{{ qnap_docker_bin | default('docker') }} compose up -d --build"
    chdir: "{{ yattee_install_dir }}"
  environment:
    HOME: "/tmp"
  register: yattee_compose_result
  changed_when: "'Started' in yattee_compose_result.stdout or 'Recreated' in yattee_compose_result.stdout"
