---
- name: 渲染 Yattee .env 环境变量文件
  ansible.builtin.template:
    src: yattee.env.j2
    dest: "{{ yattee_install_dir }}/.env"
    mode: '0600'

- name: 渲染 docker-compose.yml
  ansible.builtin.template:
    src: yattee-docker-compose.yml.j2
    dest: "{{ yattee_install_dir }}/docker-compose.yml"
    mode: '0644'

- name: 渲染 yt-dlp.conf 配置文件
  ansible.builtin.template:
    src: yt-dlp.conf.j2
    dest: "{{ yattee_install_dir }}/yt-dlp.conf"
    mode: '0644'

- name: 确保 cookies.txt 占位文件存在（防止 Docker 误创目录）
  ansible.builtin.file:
    path: "{{ yattee_install_dir }}/cookies.txt"
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve
