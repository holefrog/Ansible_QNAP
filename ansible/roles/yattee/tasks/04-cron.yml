---
- name: 部署 Yattee 自动更新脚本
  ansible.builtin.template:
    src: yattee-update.sh.j2
    dest: "{{ yattee_install_dir }}/yattee-update.sh"
    mode: '0755'

- name: 检查 QNAP /etc/config/crontab 文件是否存在（用于确定是否需要创建）
  ansible.builtin.stat:
    path: /etc/config/crontab
  register: qnap_crontab_stat
  become: yes
  become_user: admin

- name: 备份原有 crontab 配置（安全起见）
  ansible.builtin.shell:
    cmd: cp /etc/config/crontab /etc/config/crontab.backup.$(date +%Y%m%d%H%M%S)
  when: qnap_crontab_stat.stat.exists
  become: yes
  become_user: admin

- name: 向 /etc/config/crontab 添加 Yattee 自动更新任务
  ansible.builtin.lineinfile:
    path: /etc/config/crontab
    line: "0 4 * * 1 {{ yattee_install_dir }}/yattee-update.sh  # Yattee Server 每周自动更新"
    state: present
    create: true
    mode: '0644'
  register: crontab_update_result
  become: yes
  become_user: admin

- name: 重启 QNAP crond 服务以使 crontab 生效
  ansible.builtin.command:
    cmd: /etc/init.d/crond.sh restart
  when: crontab_update_result.changed
  changed_when: true
  become: yes
  become_user: admin
