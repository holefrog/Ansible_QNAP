---
- name: 确保 Ansible 用户对部署目录有写入权限
  ansible.builtin.shell: |
    echo "{{ vault_qnap_password }}" | sudo -S chown {{ ansible_user }} "{{ lms_compose_dir }}" "{{ lms_compose_dir }}/docker-compose.yml" || true
    echo "{{ vault_qnap_password }}" | sudo -S chown -R 99:100 "{{ lms_config_dir }}" || true
    echo "{{ vault_qnap_password }}" | sudo -S chown -R 99:100 "{{ lms_playlist_dir }}" || true
  ignore_errors: yes
  changed_when: false

- name: 创建 LMS 目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ lms_compose_dir }}"
    - "{{ lms_config_dir }}"
    - "{{ lms_playlist_dir }}"

- name: 检查是否有更新的 LMS 镜像
  ansible.builtin.command: "{{ qnap_docker_bin }} pull {{ lms_image }}"
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout"

- name: 查找系统上现存的所有 LMS 容器 (包括已停止)
  ansible.builtin.command: "{{ qnap_docker_bin }} ps -a --filter name=^{{ lms_container_name }}$ --format '{% raw %}{{.Names}}{% endraw %}'"
  register: existing_lms_containers
  changed_when: false

- name: 检查系统上运行中的 LMS 容器 (仅 Running 状态)
  # 区分“已存在”与“运行中”，若容器处于 Exited 状态需触发自愈拉起
  ansible.builtin.command: "{{ qnap_docker_bin }} ps --filter name=^{{ lms_container_name }}$ --format '{% raw %}{{.Names}}{% endraw %}'"
  register: running_lms_containers
  changed_when: false
